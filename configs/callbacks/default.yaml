defaults:
  - model_checkpoint
  - early_stopping
  - model_summary
  - rich_progress_bar
  - _self_

model_checkpoint:
  _target_: src.callbacks.delayed_checkpoint.DelayedModelCheckpoint
  dirpath: ${paths.output_dir}/checkpoints
  filename: "epoch_{epoch:03d}"
  monitor: "val/acc"
  mode: "max"
  save_last: True
  auto_insert_metric_name: False
  start_epoch: 100       # 前50轮不保存，之后才开始保存最佳权重
  save_top_k: 1          # 只保留1个最佳权重（新的更好时自动删除旧的）

early_stopping:
  monitor: "val/acc"
  patience: 80
  mode: "max"

model_summary:
  max_depth: -1
