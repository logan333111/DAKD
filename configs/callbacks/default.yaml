defaults:
  - model_checkpoint
  - early_stopping
  - model_summary
  - rich_progress_bar
  - _self_

model_checkpoint:
  _target_: src.callbacks.delayed_checkpoint.DelayedModelCheckpoint
  dirpath: ${paths.output_dir}/checkpoints
  filename: "epoch_{epoch:03d}"
  monitor: "val/acc"
  mode: "max"
  save_last: True
  auto_insert_metric_name: False
  start_epoch: 100     # Skip first 100 epochs, then start saving best weights
  save_top_k: 1          # Keep only the best checkpoint

early_stopping:
  monitor: "val/acc"
  patience: 20
  mode: "max"

model_summary:
  max_depth: -1
