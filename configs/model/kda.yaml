_target_: src.models.kd_module.KDModule
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.0001
  weight_decay: 0.05

scheduler:
  _target_: torch.optim.lr_scheduler.StepLR
  _partial_: true
  step_size: 30
  gamma: 0.5

use_teacher: true

# D3KD settings (set ddk_enabled=false for baseline)
ddk_enabled: true
num_domains: 10
tsd_alpha: 0.2  # Balance between cls_loss and kd_gap in TSD

net:
  _target_: src.models.components.campus.TeacherStudent
  teacher: 
    arch: convnext_xxlarge
    pretrained: src/models/teacher/open_clip_pytorch_model.bin
  data_attributes: ${data.train_dataset.attributes}
  
  student:
    arch: mobilenet_v2
    pretrained: true

  use_teacher: ${model.use_teacher}

kd_criterion:
  _target_: src.models.components.criterion.KDCriterion
  img_criterion: 
    _target_: torch.nn.L1Loss
  nlp_criterion: 
    _target_: torch.nn.KLDivLoss
  temperature: 2.0
  reduction: batchmean
  class_num: ${data.train_dataset.attributes.class_num}

compile: false
